<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exportar actividades - Club Defensores del Agua</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .exportar { max-width: 760px; margin: 40px auto; padding: 24px; background: white; border-radius: 16px; box-shadow: 0 4px 16px rgba(1, 87, 155, 0.15); }
    .exportar h1 { margin-bottom: 6px; }
    .exportar form { display: grid; gap: 8px; max-width: 360px; }
    .exportar input { padding: 10px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; }
    .exportar button { padding: 12px 16px; border: none; border-radius: 10px; background: var(--azul-agua); color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .exportar button.secundario { background: var(--verde-eco); }
    .exportar textarea { width: 100%; height: 320px; font-family: Consolas, monospace; font-size: 12px; margin-top: 12px; }
    .exportar table { border-collapse: collapse; margin: 12px 0; }
    .exportar td, .exportar th { border: 1px solid #cfd8dc; padding: 6px 12px; text-align: left; }
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    #estado { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="exportar">
    <h1>Exportar actividades</h1>
    <p>Página temporal para descargar la colección <b>niveles</b>. Ingresa con una cuenta de administrador o profesor.</p>

    <form id="form-login">
      <label for="correo">Correo</label>
      <input type="email" id="correo" required autocomplete="username" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit">Ingresar y exportar</button>
    </form>

    <p id="estado"></p>
    <div id="resultado" hidden>
      <table id="resumen"></table>
      <div class="acciones">
        <button id="btn-descargar" type="button" class="secundario">Descargar niveles.json</button>
        <button id="btn-copiar" type="button">Copiar todo</button>
      </div>
      <textarea id="json" readonly></textarea>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { iniciarSesion } from "./js/auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const estado = document.getElementById("estado");

    // Convierte valores especiales de Firestore (fechas, referencias) a texto
    function limpiar(valor) {
      if (valor === null || valor === undefined) return valor;
      if (typeof valor.toDate === "function") return valor.toDate().toISOString();
      if (valor.path && valor.firestore) return valor.path;
      if (Array.isArray(valor)) return valor.map(limpiar);
      if (typeof valor === "object") {
        const out = {};
        for (const [k, v] of Object.entries(valor)) out[k] = limpiar(v);
        return out;
      }
      return valor;
    }

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      estado.textContent = "Ingresando...";
      try {
        await iniciarSesion(
          document.getElementById("correo").value.trim(),
          document.getElementById("password").value
        );
        estado.textContent = "Leyendo actividades...";
        const snap = await getDocs(collection(db, "niveles"));
        const niveles = snap.docs
          .map((d) => ({ id: d.id, ...limpiar(d.data()) }))
          .sort((a, b) => String(a.ejeTematico).localeCompare(String(b.ejeTematico)) || (a.orden ?? 0) - (b.orden ?? 0));

        const texto = JSON.stringify(niveles, null, 2);
        document.getElementById("json").value = texto;

        const porEje = {};
        niveles.forEach((n) => { porEje[n.ejeTematico || "(sin eje)"] = (porEje[n.ejeTematico || "(sin eje)"] || 0) + 1; });
        document.getElementById("resumen").innerHTML =
          "<tr><th>Eje</th><th>Actividades</th></tr>" +
          Object.entries(porEje).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") +
          `<tr><th>Total</th><th>${niveles.length}</th></tr>`;

        document.getElementById("btn-descargar").onclick = () => {
          const blob = new Blob([texto], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "niveles.json";
          a.click();
          URL.revokeObjectURL(a.href);
        };
        document.getElementById("btn-copiar").onclick = async () => {
          try { await navigator.clipboard.writeText(texto); estado.textContent = "Copiado. Pégalo en el chat."; }
          catch { document.getElementById("json").select(); estado.textContent = "Selecciona el texto y cópialo con Ctrl+C."; }
        };

        document.getElementById("resultado").hidden = false;
        estado.textContent = `Listo: ${niveles.length} actividades encontradas.`;
      } catch (error) {
        console.error(error);
        estado.textContent = error.code === "permission-denied"
          ? "Tu cuenta no tiene permiso para leer todas las actividades."
          : "No se pudo ingresar o leer las actividades. Revisa el correo y la contraseña.";
      }
    });
  </script>
</body>
</html>
