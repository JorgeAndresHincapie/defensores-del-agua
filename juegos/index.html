<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Juegos — Club Defensores del Agua</title>
<style>
  :root {
    --azul-agua: #0288d1;
    --azul-oscuro: #01579b;
    --verde-eco: #2e7d32;
    --fondo: #e1f5fe;
    --texto: #01313f;
    --error: #c62828;
    --amarillo: #f9a825;
    --blanco: #ffffff;
    --sombra: 0 4px 16px rgba(1, 87, 155, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
  }
  button { font-family: inherit; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; background: var(--azul-oscuro); color: white;
    position: sticky; top: 0; z-index: 10;
  }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca svg { width: 38px; height: 38px; flex: none; }
  .marca b { display: block; font-size: 1.05rem; }
  .marca small { opacity: .8; font-size: .8rem; }
  .puntos {
    background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 14px;
    font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .derecha { display: flex; align-items: center; gap: 8px; }
  .grupo-pill { white-space: nowrap; background: white; color: var(--azul-oscuro); border: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: .85rem; }
  .grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .grupo-card {
    border: none; border-radius: 20px; padding: 24px 20px; text-align: left; cursor: pointer; background: white;
    box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 10px; color: var(--texto); font-size: 1rem;
    border-top: 0; min-height: 210px;
  }
  .grupo-card:hover, .grupo-card:focus-visible { outline: 4px solid var(--amarillo); }
  .grupo-card .circ { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 1.6rem; font-weight: 800; }
  .grupo-card b { font-size: 1.3rem; color: var(--azul-oscuro); }
  .grupo-card .grados { font-weight: 700; }
  body.g-primaria { font-size: 18px; }
  body.g-primaria .reto-btn, body.g-primaria .opcion, body.g-primaria .ficha { font-size: 1.1rem; min-height: 64px; }
  body.g-primaria .pregunta { font-size: 1.3rem; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { color: var(--azul-oscuro); font-size: 1.6rem; margin: 0 0 6px; }
  .intro { margin: 0 0 22px; color: #35565f; }

  /* Mapa de ejes */
  .ejes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .eje {
    background: white; border-radius: 18px; box-shadow: var(--sombra); padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .eje-cab { display: flex; align-items: center; gap: 12px; }
  .eje-icono { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .eje-icono svg { width: 30px; height: 30px; }
  .eje h2 { font-size: 1.1rem; margin: 0; color: var(--azul-oscuro); }
  .eje .conteo { font-size: .8rem; color: #5c7a82; }
  .reto-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px;
    border: 2px solid #d6ecf7; background: #f6fbfe; color: var(--texto); cursor: pointer;
    font-size: .95rem; min-height: 52px;
  }
  .reto-btn:hover, .reto-btn:focus-visible { border-color: var(--azul-agua); outline: none; }
  .reto-btn .tipo { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: #5c7a82; display: block; }
  .reto-btn .hecho { color: var(--verde-eco); font-weight: 700; }
  .nota {
    margin-top: 26px; background: white; border-radius: 14px; padding: 16px 18px;
    box-shadow: var(--sombra); font-size: .92rem; color: #35565f;
  }

  /* Pantalla de juego */
  .juego { background: white; border-radius: 18px; box-shadow: var(--sombra); padding: 22px; }
  .volver {
    background: none; border: none; color: var(--azul-agua); font-weight: 700; font-size: 1rem;
    cursor: pointer; padding: 6px 0; margin-bottom: 8px;
  }
  .etiqueta {
    display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase;
    background: var(--fondo); color: var(--azul-oscuro); padding: 4px 10px; border-radius: 6px;
  }
  .juego h1 { margin-top: 10px; }
  .instruccion { font-size: 1.05rem; margin: 6px 0 16px; }
  .barra { height: 10px; background: #e3eef3; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--verde-eco); transition: width .4s; }
  .feedback { min-height: 28px; font-weight: 700; margin: 14px 0 0; }
  .feedback.ok { color: var(--verde-eco); }
  .feedback.mal { color: var(--error); }
  .dato {
    background: #e8f5e9; color: #1b5e20; border-radius: 12px; padding: 12px 14px; margin-top: 12px;
    font-size: .95rem; display: none;
  }
  .dato.ver { display: block; animation: aparecer .35s ease; }
  .final {
    text-align: center; padding: 18px 10px 4px; display: none;
  }
  .final.ver { display: block; animation: aparecer .4s ease; }
  .final svg { width: 90px; height: 90px; }
  .final h2 { color: var(--verde-eco); margin: 8px 0 4px; }
  .btn {
    border: none; border-radius: 12px; padding: 14px 22px; font-size: 1rem; font-weight: 700;
    cursor: pointer; min-height: 50px;
  }
  .btn-verde { background: var(--verde-eco); color: white; }
  .btn-azul { background: var(--azul-agua); color: white; }
  .btn-claro { background: var(--fondo); color: var(--azul-oscuro); }
  .acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  /* Ordenar */
  .ranuras { display: grid; gap: 8px; margin-bottom: 16px; }
  .ranura {
    min-height: 58px; border: 2px dashed #9cc9df; border-radius: 12px; display: flex; align-items: center;
    gap: 10px; padding: 6px 10px; background: #f6fbfe;
  }
  .ranura .num {
    width: 30px; height: 30px; border-radius: 50%; background: var(--azul-oscuro); color: white;
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  .ranura.llena { border-style: solid; border-color: var(--azul-agua); background: white; }
  .ranura.ok { border-color: var(--verde-eco); background: #f1f8f2; }
  .ranura.mal { border-color: var(--error); animation: sacudir .4s; }
  .fichas { display: flex; flex-wrap: wrap; gap: 10px; }
  .ficha {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px;
    background: white; border: 2px solid #b9dcee; cursor: pointer; font-size: .98rem; color: var(--texto);
    min-height: 52px; text-align: left;
  }
  .ficha:hover, .ficha:focus-visible { border-color: var(--azul-agua); outline: none; }
  .ficha svg { width: 30px; height: 30px; flex: none; }
  .ranura .ficha { border: none; padding: 0; min-height: 0; flex: 1; background: transparent; }

  /* Clasificar */
  .cola { display: flex; justify-content: center; margin: 4px 0 18px; min-height: 120px; }
  .objeto {
    width: 150px; height: 120px; border-radius: 16px; background: white; border: 3px solid var(--azul-agua);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-weight: 700; text-align: center; padding: 8px; animation: aparecer .3s ease;
  }
  .objeto svg { width: 54px; height: 54px; }
  .objeto.mal { animation: sacudir .4s; border-color: var(--error); }
  .canecas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .caneca {
    border: none; border-radius: 16px; padding: 14px 10px; cursor: pointer; color: white; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .95rem; min-height: 150px;
  }
  .caneca svg { width: 60px; height: 70px; }
  .caneca small { font-weight: 400; opacity: .92; }
  .caneca:focus-visible { outline: 4px solid var(--amarillo); }
  .caneca.blanca { background: #eceff1; color: var(--texto); border: 2px solid #b0bec5; }
  .caneca.negra { background: #263238; }
  .caneca.verde { background: #2e7d32; }
  .caneca.salto { animation: salto .35s; }

  /* Escena */
  .escena-wrap { position: relative; border-radius: 16px; overflow: hidden; background: #fffef8; border: 2px solid #d6ecf7; }
  .escena-wrap svg { display: block; width: 100%; height: auto; }
  .punto { cursor: pointer; }
  .punto .halo { fill: rgba(2, 136, 209, 0); stroke: rgba(2,136,209,0); stroke-width: 3; transition: all .2s; }
  .punto:hover .halo, .punto:focus .halo { fill: rgba(249,168,37,.18); stroke: rgba(249,168,37,.9); }
  .explorar .punto .halo { fill: rgba(249,168,37,.08); stroke: rgba(249,168,37,.8); stroke-dasharray: 6 5; }
  .punto.encontrado .halo { fill: rgba(46,125,50,.18); stroke: #2e7d32; }
  .punto:focus { outline: none; }
  .marcador { display: none; }
  .punto.encontrado .marcador { display: inline; }
  .punto.encontrado .pregunta-m { display: none; }
  .contador { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; }
  .gota { width: 28px; height: 28px; }

  /* Cuestionario */
  .pregunta { font-size: 1.15rem; font-weight: 700; margin: 0 0 14px; }
  .opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .opcion {
    border: 2px solid #b9dcee; background: white; border-radius: 14px; padding: 14px; cursor: pointer;
    font-size: 1rem; text-align: left; display: flex; gap: 10px; align-items: center; color: var(--texto); min-height: 60px;
  }
  .opcion:hover, .opcion:focus-visible { border-color: var(--azul-agua); outline: none; }
  .opcion .letra {
    width: 30px; height: 30px; border-radius: 50%; background: var(--fondo); color: var(--azul-oscuro);
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  .opcion.ok { border-color: var(--verde-eco); background: #f1f8f2; }
  .opcion.mal { border-color: var(--error); animation: sacudir .4s; }
  .opcion:disabled { cursor: default; }

  /* Parejas */
  .tablero { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .carta {
    aspect-ratio: 4 / 3; border-radius: 14px; border: none; cursor: pointer; perspective: 600px;
    background: transparent; padding: 0; font-size: .92rem; position: relative;
  }
  .carta .cara {
    position: absolute; inset: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 10px; font-weight: 700; transition: transform .35s; backface-visibility: hidden;
  }
  .carta .dorso { background: var(--azul-agua); color: white; }
  .carta .dorso svg { width: 40px; height: 40px; }
  .carta .frente { background: white; border: 2px solid #b9dcee; color: var(--texto); transform: rotateY(180deg); }
  .carta.volteada .dorso { transform: rotateY(180deg); }
  .carta.volteada .frente { transform: rotateY(360deg); }
  .carta.par .frente { border-color: var(--verde-eco); background: #f1f8f2; }
  .carta:focus-visible { outline: 4px solid var(--amarillo); }

  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes sacudir { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes salto { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 560px) {
    .marca small { display: none; }
    h1 { font-size: 1.35rem; }
    .juego { padding: 16px; }
  }
  /* ---- v2 ---- */
  .eje { cursor: pointer; border: none; text-align: left; font: inherit; color: inherit; }
  .eje:hover, .eje:focus-visible { outline: 4px solid var(--amarillo); }
  .eje .mini-barra { height: 8px; background: #e3eef3; border-radius: 99px; overflow: hidden; }
  .eje .mini-barra i { display: block; height: 100%; background: var(--verde-eco); }
  .cab-eje { display: flex; align-items: center; gap: 14px; margin: 6px 0 14px; }
  .cab-eje .eje-icono { width: 64px; height: 64px; }
  .cab-eje h1 { margin: 0; }
  .seccion-t { font-size: 1.05rem; color: var(--azul-oscuro); margin: 22px 0 10px; }
  .asignados { background: #fff8e1; border: 2px solid #ffe082; border-radius: 16px; padding: 4px 16px 16px; margin: 0 0 22px; }
  .asignados .seccion-t { margin-top: 14px; }
  .asignados .sub { margin: -4px 0 12px; color: #6d5a00; font-size: .9rem; }
  .niveles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .nivel {
    background: white; border: none; border-radius: 16px; box-shadow: var(--sombra); padding: 14px 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font: inherit; color: var(--texto); min-height: 150px;
  }
  .nivel[hidden] { display: none; }
  .nivel:hover, .nivel:focus-visible { outline: 4px solid var(--amarillo); }
  .nivel .bola { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 800; font-size: 1.1rem; }
  .nivel.hecho .bola { background: var(--verde-eco) !important; }
  .nivel .t { font-size: .88rem; font-weight: 600; line-height: 1.25; }
  .nivel .tipo { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #5c7a82; }
  .nivel .est { color: var(--amarillo); letter-spacing: 2px; font-size: .9rem; min-height: 1em; }
  .ruta-wrap { border-radius: 16px; overflow: hidden; border: 2px solid #d6ecf7; margin-bottom: 16px; }
  .ruta-wrap svg { display: block; width: 100%; height: auto; }
  #avatar { transition: transform .8s cubic-bezier(.5,1.6,.5,1); }
  .contexto { background: var(--fondo); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: .95rem; }
  .reto-card { display: flex; gap: 16px; align-items: flex-start; background: var(--fondo); border-radius: 16px; padding: 18px; }
  .reto-card svg { width: 64px; height: 64px; flex: none; }
  .estrellas { font-size: 2rem; color: var(--amarillo); letter-spacing: 6px; }
  .aviso { font-size: .85rem; color: #5c7a82; margin-top: 18px; }
  .buscar { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #b9dcee; font-size: 1rem; margin-bottom: 4px; }

  /* ---- arrastrar ---- */
  .dd-zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .dd-zona { border: 3px dashed var(--c); background: white; border-radius: 16px; min-height: 130px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: left; cursor: pointer; font: inherit; color: var(--texto); transition: transform .15s, background .15s; }
  .dd-cab { font-weight: 800; color: var(--c); display: flex; align-items: center; gap: 8px; font-size: 1rem; }
  .dd-emo { font-size: 1.6rem; }
  .dd-dentro { display: flex; flex-wrap: wrap; gap: 6px; }
  .dd-zona.hover, .dd-zona-d.hover { background: #fffde7; transform: scale(1.02); }
  .dd-zona.mal, .dd-zona-d.mal { animation: sacudir .4s; }
  .dd-bandeja { display: flex; flex-wrap: wrap; gap: 10px; min-height: 20px; }
  .dd-chip { touch-action: none; user-select: none; -webkit-user-select: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: white; border: 2px solid #b9dcee; font: inherit; font-size: .98rem; cursor: grab; min-height: 48px; color: var(--texto); box-shadow: 0 2px 6px rgba(1,87,155,.12); text-align: left; }
  .dd-chip > span:first-child { font-size: 1.4rem; }
  .dd-chip.sel { outline: 3px solid var(--amarillo); border-color: var(--amarillo); }
  .dd-chip.origen { opacity: .35; }
  .dd-chip.puesto { cursor: default; border-color: var(--verde-eco); background: #f1f8f2; font-size: .85rem; min-height: 0; padding: 6px 10px; box-shadow: none; }
  .dd-chip.puesto > span:first-child { font-size: 1.05rem; }
  .dd-chip.mal { animation: sacudir .4s; border-color: var(--error); }
  .dd-fantasma { position: fixed; z-index: 100; pointer-events: none; transform: rotate(-3deg); box-shadow: 0 10px 24px rgba(0,0,0,.25); margin: 0; }
  .dd-diagrama { max-width: 620px; margin: 0 auto; position: relative; border-radius: 16px; overflow: hidden; border: 2px solid #d6ecf7; }
  .dd-diagrama svg { display: block; width: 100%; height: auto; }
  .dd-zona-d .dd-dentro { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .dd-titulo { font-weight: 800; font-size: .8rem; color: var(--azul-oscuro); opacity: .75; }
  .dd-bandeja, .dd-zonas, .dd-diagrama { user-select: none; -webkit-user-select: none; }
  .dd-zona-d { position: absolute; border: 3px dashed rgba(1,87,155,.6); background: rgba(255,255,255,.22); border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; padding: 2px; transition: transform .15s, background .15s; }
  .dd-zona-d.ok { border: 3px solid var(--verde-eco); background: rgba(241,248,242,.82); cursor: default; }
  .dd-nom { font-weight: 800; font-size: .85rem; color: var(--azul-oscuro); background: rgba(255,255,255,.88); border-radius: 8px; padding: 2px 6px; text-align: center; }

  /* ---- historia ---- */
  .tira { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tira i { width: 34px; height: 26px; border-radius: 6px; border: 2px solid #b9dcee; background: white; display: grid; place-items: center; font-style: normal; font-size: .75rem; font-weight: 700; color: #90a4ae; }
  .tira i.hecha { background: var(--verde-eco); border-color: var(--verde-eco); color: white; }
  .tira i.actual { border-color: var(--azul-agua); color: var(--azul-agua); }
  .viñeta { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: end; background: linear-gradient(#e1f5fe, #fff); border: 3px solid #01579b; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .viñeta svg { width: 150px; height: 190px; }
  .globo { position: relative; background: white; border: 3px solid #01579b; border-radius: 20px; padding: 14px 16px; font-size: 1.08rem; font-weight: 600; align-self: start; }
  .globo::after { content: ""; position: absolute; left: -16px; bottom: 22px; border: 10px solid transparent; border-right-color: #01579b; border-left: 0; }
  .globo .rol { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--azul-agua); margin-bottom: 4px; }
  .respuestas { display: grid; gap: 10px; }
  .resp { justify-self: end; max-width: 92%; background: #e8f5e9; border: 2px solid #a5d6a7; border-radius: 18px 18px 4px 18px; padding: 12px 16px; font: inherit; font-size: 1rem; text-align: left; cursor: pointer; color: var(--texto); min-height: 48px; }
  .resp:hover, .resp:focus-visible { border-color: var(--verde-eco); outline: none; }
  .resp.ok { background: var(--verde-eco); color: white; border-color: var(--verde-eco); }
  .resp.mal { border-color: var(--error); background: #ffebee; animation: sacudir .4s; }
  @media (max-width: 560px) { .viñeta { grid-template-columns: 90px 1fr; } .viñeta svg { width: 90px; height: 120px; } }

  /* ---- simuladores ---- */
  .sim { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.2fr); gap: 18px; align-items: start; }
  .sim-dibujo { background: #f6fbfe; border: 2px solid #d6ecf7; border-radius: 16px; overflow: hidden; position: sticky; top: 76px; }
  .sim-dibujo svg { display: block; width: 100%; height: auto; }
  .sim-panel { display: flex; flex-direction: column; gap: 12px; }
  .sim-mision { background: #fff8e1; border: 2px solid #ffe082; border-radius: 12px; padding: 10px 12px; }
  .sim-mision.ok { background: #e8f5e9; border-color: #a5d6a7; }
  .sim-mision.ok b::after { content: " ✓"; color: var(--verde-eco); }
  .sim-ctrl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .sim-ctrl input { grid-column: 1 / -1; width: 100%; accent-color: var(--azul-agua); height: 28px; }
  .sim-ctrl small { grid-column: 1 / -1; color: #5c7a82; font-size: .8rem; }
  .sim-lab { font-weight: 600; font-size: .95rem; }
  .sim-val { font-weight: 800; color: var(--azul-oscuro); white-space: nowrap; }
  .sim-sw { display: flex; align-items: center; gap: 10px; background: white; border: 2px solid #b9dcee; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: .95rem; cursor: pointer; text-align: left; color: var(--texto); min-height: 48px; }

          ghost.style.left = (ev.clientX - ox) + "px"; ghost.style.top = (ev.clientY - oy) + "px";
          const t = document.elementFromPoint(ev.clientX, ev.clientY);
          const z = t && t.closest("[data-zona]");
          if (sobre && sobre !== z) sobre.classList.remove("hover");
          if (z && !z.disabled) z.classList.add("hover");
          sobre = z && !z.disabled ? z : null;
        };
        const fin = ev => {
          document.removeEventListener("pointermove", mover); document.removeEventListener("pointerup", fin); document.removeEventListener("pointercancel", fin);
          if (!movido) return;
          ghost.remove(); c.classList.remove("origen"); if (sobre) sobre.classList.remove("hover");
          c._arrastrado = true; setTimeout(() => { c._arrastrado = false; }, 50);
          if (sobre && ev.type === "pointerup") intentar(c, sobre.dataset.zona);
        };
        document.addEventListener("pointermove", mover, { passive: false });
        document.addEventListener("pointerup", fin); document.addEventListener("pointercancel", fin);
      });
      c.addEventListener("click", () => {
        if (c._arrastrado || c.disabled) return;
        const ya = c.classList.contains("sel"); limpiarSel();
        if (!ya) { sel = c; c.classList.add("sel"); ctx.fb("Ahora toca dónde va."); }
      });
    }
    items.forEach(it => {
      const c = el("button", { class: "dd-chip", type: "button" }, `<span>${it.emoji || ""}</span><span>${esc(it.texto)}</span>`);
      c._it = it; bandeja.append(c); arrastrable(c);
    });
    zona.append(area, el("p", { class: "instruccion", style: "margin:16px 0 8px" }, "Tarjetas: arrástralas a su lugar, o tócalas y luego toca dónde van."), bandeja);
  },


  historia(zona, act, ctx) {
    const qs = act.preguntas, color = ctx.eje.color;
    const rol = (act.titulo.split(":")[1] || act.titulo).trim();
    const tira = el("div", { class: "tira", "aria-hidden": "true" });
    qs.forEach((_, i) => tira.append(el("i", {}, String(i + 1))));
    const cont = el("div");
    zona.append(tira, cont);
    const personaje = (boca) => `<svg viewBox="0 0 150 190" aria-hidden="true">
      <ellipse cx="75" cy="184" rx="42" ry="6" fill="rgba(0,0,0,.12)"/>
      <rect x="45" y="100" width="60" height="70" rx="22" fill="${color}"/>
      <rect x="28" y="108" width="18" height="48" rx="9" fill="${color}"/><rect x="104" y="108" width="18" height="48" rx="9" fill="${color}"/>
      <circle cx="37" cy="158" r="9" fill="#ffcc80"/><circle cx="113" cy="158" r="9" fill="#ffcc80"/>
      <circle cx="75" cy="62" r="38" fill="#ffcc80"/>
      <path d="M38 55c0-30 20-40 37-40s38 10 38 40c-10-12-30-18-38-18s-27 6-37 18z" fill="#4e342e"/>
      <circle cx="62" cy="64" r="5" fill="#01313f"/><circle cx="88" cy="64" r="5" fill="#01313f"/>
      <circle cx="55" cy="76" r="5" fill="#ffab91" opacity=".7"/><circle cx="95" cy="76" r="5" fill="#ffab91" opacity=".7"/>
      ${boca === "feliz" ? '<path d="M60 80 Q75 96 90 80" stroke="#01313f" stroke-width="4" fill="#fff" stroke-linecap="round"/>'
        : boca === "duda" ? '<ellipse cx="75" cy="85" rx="6" ry="7" fill="#01313f"/>'
        : '<path d="M63 84 Q75 90 87 84" stroke="#01313f" stroke-width="4" fill="none" stroke-linecap="round"/>'}
      <path d="M58 100l17 14 17-14" fill="#fff"/>
      <path d="M68 132c3 4 4 6 4 8a4 4 0 0 1-8 0c0-2 1-4 4-8z" fill="#fff"/>
    </svg>`;
    let n = 0;
    function mostrar() {
      const q = qs[n];
      tira.querySelectorAll("i").forEach((x, i) => { x.className = i < n ? "hecha" : i === n ? "actual" : ""; });
      cont.innerHTML = "";
      const v = el("div", { class: "viñeta" }, `<div class="cara-p">${personaje("normal")}</div><div class="globo"><span class="rol">${esc(rol)} · viñeta ${n + 1} de ${qs.length}</span>${q.ctx ? esc(q.ctx) + "<br>" : ""}${esc(q.p)}</div>`);
      cont.append(v);
      const rs = el("div", { class: "respuestas" });
      mezclar(q.o.map((t, i) => ({ t, i }))).forEach(o => {
        const b = el("button", { class: "resp", type: "button" }, esc(o.t));
        b.addEventListener("click", () => {
          if (o.i === q.c) {
            b.classList.add("ok"); rs.querySelectorAll("button").forEach(x => x.disabled = true);
            v.querySelector(".cara-p").innerHTML = personaje("feliz");
            ctx.fb("¡Buena decisión! " + (q.r || ""), true);
            n++;
            setTimeout(() => { if (n < qs.length) { ctx.fb(""); mostrar(); } else { tira.querySelectorAll("i").forEach(x => x.className = "hecha"); cont.innerHTML = ""; ctx.completar(); } }, q.r ? 2200 : 1400);
          } else {
            b.classList.remove("mal"); void b.offsetWidth; b.classList.add("mal"); b.disabled = true;
            v.querySelector(".cara-p").innerHTML = personaje("duda");
            ctx.fb("Mmm… esa no parece la mejor decisión. Prueba otra.", false);
          }
        });
        rs.append(b);
      });
      cont.append(rs);
    }
    mostrar();
  },

  reto(zona, act, ctx) {
    ctx.instr("Este es un reto para hacer fuera de la pantalla, en tu casa, en el colegio o en tu vereda.");
    zona.append(el("div", { class: "reto-card" }, `${ICONOS.libreta}<div><p style="margin-top:0"><b>${esc(act.desc)}</b></p>${act.objetivo ? `<p>Objetivo: ${esc(act.objetivo)}</p>` : ""}<p>Cuando termines, toca el botón para registrar tu reto.</p></div>`));
    const acc = el("div", { class: "acciones" });
    const b = el("button", { class: "btn btn-verde", type: "button" }, "✓ ¡Lo hice!");
    b.addEventListener("click", () => { b.disabled = true; ctx.completar(); });
    acc.append(b); zona.append(acc);
  },

  ordenar(zona, j, ctx) {
    const ranuras = el("div", { class: "ranuras" });
    const fichas = el("div", { class: "fichas" });
    const slots = j.pasos.map((_, i) => { const s = el("div", { class: "ranura" }, `<span class="num">${i + 1}</span>`); ranuras.append(s); return s; });
    const colocados = new Array(j.pasos.length).fill(null);
    function crearFicha(idx) {
      const p = j.pasos[idx];
      const f = el("button", { class: "ficha", type: "button" }, `${ICONOS[p.icono] || ""}<span>${esc(p.texto)}</span>`);
      f.dataset.idx = idx;
      f.addEventListener("click", () => {
        const enRanura = colocados.indexOf(idx);
        if (enRanura >= 0) { colocados[enRanura] = null; slots[enRanura].classList.remove("llena", "mal", "ok"); fichas.append(f); ctx.fb(""); return; }
        const libre = colocados.indexOf(null);
        if (libre < 0) return;
        colocados[libre] = idx; slots[libre].append(f); slots[libre].classList.add("llena");
        if (colocados.every(c => c !== null)) revisar();
      });
      return f;
    }
    function revisar() {
      let todo = true;
      colocados.forEach((c, i) => { slots[i].classList.remove("ok", "mal"); void slots[i].offsetWidth; const bien = c === i; slots[i].classList.add(bien ? "ok" : "mal"); if (!bien) todo = false; });
      if (todo) { ctx.fb("¡Correcto! Así es el recorrido 💧", true); fichas.remove(); ranuras.querySelectorAll(".ficha").forEach(b => b.disabled = true); ctx.completar(); }
      else ctx.fb("Algunos pasos no están en su lugar (en rojo). Tócalos para devolverlos y vuelve a intentar.", false);
    }
    mezclar(j.pasos.map((_, i) => i)).forEach(i => fichas.append(crearFicha(i)));
    zona.append(ranuras, fichas);
  },

  cuestionario(zona, j, ctx) {
    let n = 0;
    const barra = el("div", { class: "barra" }, "<i></i>");
    const cont = el("div");
    zona.append(barra, cont);
    function mostrar() {
      const q = j.preguntas[n];
      barra.firstChild.style.width = (n / j.preguntas.length * 100) + "%";
      cont.innerHTML = "";
      cont.append(el("p", { class: "instruccion" }, `Pregunta ${n + 1} de ${j.preguntas.length}`), el("p", { class: "pregunta" }, q.pregunta));
      const ops = el("div", { class: "opciones" });
      q.opciones.forEach((o, i) => {
        const b = el("button", { class: "opcion", type: "button" }, `<span class="letra">${"ABCD"[i]}</span><span>${o}</span>`);
        b.addEventListener("click", () => {
          if (i === q.correcta) {
            b.classList.add("ok"); ops.querySelectorAll("button").forEach(x => x.disabled = true);
            ctx.fb("¡Correcto! " + (q.explicacion || ""), true);
            setTimeout(() => { n++; if (n < j.preguntas.length) { ctx.fb(""); mostrar(); } else { barra.firstChild.style.width = "100%"; ctx.completar(); } }, 1800);
          } else { b.classList.remove("mal"); void b.offsetWidth; b.classList.add("mal"); b.disabled = true; ctx.fb("Esa no es. Intenta otra opción.", false); }
        });
        ops.append(b);
      });
      cont.append(ops);
    }
    mostrar();
  },

  escena(zona, j, ctx) {
    const esc = ESCENAS[j.escena];
    const wrap = el("div", { class: "escena-wrap " + (j.modo || "") });
    const ns = "http://www.w3.org/2000/svg";
    wrap.innerHTML = `<svg viewBox="${esc.vb}" role="img" aria-label="Escena interactiva">${esc.dibujo()}</svg>`;
    const svg = wrap.firstChild;
    const contador = el("div", { class: "contador", "aria-hidden": "true" });
    const encontrados = new Set();
    j.puntos.forEach(p => {
      const g = document.createElementNS(ns, "g");
      g.setAttribute("class", "punto"); g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
      g.setAttribute("aria-label", j.modo === "explorar" ? p.titulo : "Zona de la escena");
      const rect = p.w !== undefined;
      const mx = rect ? p.x + p.w - 4 : p.x + p.r * .7, my = rect ? p.y + 4 : p.y - p.r * .7;
      const halo = rect ? `<rect class="halo" x="${p.x - 4}" y="${p.y - 4}" width="${p.w + 8}" height="${p.h + 8}" rx="12"/>` : `<circle class="halo" cx="${p.x}" cy="${p.y}" r="${p.r}"/>`;
      g.innerHTML = `${halo}${j.modo === "explorar" ? `<g class="pregunta-m"><circle cx="${mx}" cy="${my}" r="12" fill="#f9a825"/><text x="${mx}" y="${my + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI, Arial">?</text></g>` : ""}<g class="marcador"><circle cx="${mx}" cy="${my}" r="13" fill="#2e7d32"/><path d="M${mx - 6} ${my}l4 4 8-8" stroke="#fff" stroke-width="3" fill="none"/></g>`;
      const activar = () => {
        ctx.fb(`${p.titulo}: ${p.texto}`, true);
        if (encontrados.has(p.id)) return;
        encontrados.add(p.id); g.classList.add("encontrado"); pintarContador();
        if (encontrados.size === j.puntos.length) setTimeout(ctx.completar, 600);
      };
      g.addEventListener("click", activar);
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activar(); } });
      svg.append(g);
    });
    function pintarContador() {
      contador.innerHTML = j.puntos.map((_, i) => `<svg class="gota" viewBox="0 0 32 32"><path d="M16 3c5 7 9 11.5 9 16a9 9 0 0 1-18 0c0-4.5 4-9 9-16z" fill="${i < encontrados.size ? "#2e7d32" : "#b3d4e0"}"/></svg>`).join("") +
        `<span style="align-self:center;font-weight:700">${encontrados.size} de ${j.puntos.length}</span>`;
    }
    if (j.modo === "buscar") svg.addEventListener("click", e => { if (!e.target.closest(".punto")) ctx.fb("Ahí no hay desperdicio. Sigue buscando.", false); });
    pintarContador();
    zona.append(wrap, contador);
  },

  clasificar(zona, j, ctx) {
    const items = mezclar(j.items);
    let i = 0;
    const barra = el("div", { class: "barra" }, "<i></i>");
    const cola = el("div", { class: "cola", "aria-live": "polite" });
    const canecas = el("div", { class: "canecas" });
    j.grupos.forEach(gr => {
      const b = el("button", { class: "caneca " + gr.id, type: "button" }, `${ICONOS.caneca}<span>Caneca ${gr.nombre}</span><small>${gr.ayuda}</small>`);
      b.addEventListener("click", () => {
        if (i >= items.length) return;
        const it = items[i];
        if (it.grupo === gr.id) {
          b.classList.remove("salto"); void b.offsetWidth; b.classList.add("salto");
          ctx.fb(`¡Bien! ${it.texto} va en la caneca ${gr.nombre.toLowerCase()}.`, true);
          i++; barra.firstChild.style.width = (i / items.length * 100) + "%";
          if (i < items.length) mostrar(); else { cola.innerHTML = ""; ctx.completar(); }
        } else {
          const o = cola.firstChild; o.classList.remove("mal"); void o.offsetWidth; o.classList.add("mal");
          ctx.fb(`No va en la caneca ${gr.nombre.toLowerCase()}. Piensa: ¿es aprovechable, orgánico o no aprovechable?`, false);
        }
      });
      canecas.append(b);
    });
    function mostrar() { const it = items[i]; cola.innerHTML = ""; cola.append(el("div", { class: "objeto" }, `${ICONOS[it.icono] || ""}<span>${it.texto}</span>`)); }
    mostrar();
    zona.append(barra, cola, canecas);
  },

  parejas(zona, j, ctx) {
    const cartas = mezclar(j.pares.flatMap((p, k) => [{ k, t: p[0] }, { k, t: p[1] }]));
    const tablero = el("div", { class: "tablero" });
    let abiertas = [], hechos = 0, bloqueo = false;
    cartas.forEach(c => {
      const b = el("button", { class: "carta", type: "button", "aria-label": "Carta boca abajo" },
        `<div class="cara dorso">${ICONOS.gota}</div><div class="cara frente">${c.t}</div>`);
      b.addEventListener("click", () => {
        if (bloqueo || b.classList.contains("volteada")) return;
        b.classList.add("volteada"); b.setAttribute("aria-label", c.t); abiertas.push({ b, c });
        if (abiertas.length === 2) {
          const [x, y] = abiertas;
          if (x.c.k === y.c.k) {
            x.b.classList.add("par"); y.b.classList.add("par"); abiertas = []; hechos++;
            ctx.fb("¡Pareja encontrada!", true);
            if (hechos === j.pares.length) setTimeout(ctx.completar, 500);
          } else {
            bloqueo = true; ctx.fb("No son pareja. Recuerda dónde están.", false);
            setTimeout(() => { [x, y].forEach(o => { o.b.classList.remove("volteada"); o.b.setAttribute("aria-label", "Carta boca abajo"); }); abiertas = []; bloqueo = false; }, 1100);
          }
        }
      });
      tablero.append(b);
    });
    zona.append(tablero);
  },
};

/* ============================ ARRANQUE ================================== */
function cargarEspeciales() {
  return ACTIVIDADES_V1.filter(a => ["escena", "clasificar", "parejas"].includes(a.juego.tipo)).map(a => ({
    id: "esp-" + a.id, eje: EQUIV_EJE_V1[a.ejeTematico], orden: 0, titulo: a.titulo, desc: a.descripcion, pts: a.puntosOtorga, grupos: a.grupos, juego: a.juego,
  }));
}
$app.innerHTML = '<p class="intro">Cargando actividades…</p>';
Promise.all([fetch("actividades.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), esperarRemoto.catch(e => { console.error(e); return null; })])
  .then(([data, remoto]) => { fusionar(remoto); ACTIVIDADES = [...cargarEspeciales(), ...data]; marcarHechosApp(); inicio(); })
  .catch(err => { console.error(err); $app.innerHTML = '<p class="intro">No se pudieron cargar las actividades. Recarga la página.</p>'; });
</script>
