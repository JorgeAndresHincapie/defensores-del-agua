<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi progreso - Club Defensores del Agua</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .btn-juegos { display:inline-block; margin:0 0 16px; padding:12px 20px; border-radius:12px; background:#2e7d32; color:#fff; font-weight:700; text-decoration:none; box-shadow:0 4px 12px rgba(46,125,50,.25); }
    .btn-juegos:hover { background:#1b5e20; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-user">
      <img src="icons/icon-192.png" alt="" class="avatar" />
      <div>
        <p class="user-name" id="nombre-usuario">Cargando...</p>
        <p class="user-club">Institución Educativa El Llano</p>
      </div>
    </div>
    <div class="topbar-stats">
      <div class="stat">
        <span class="stat-value" id="puntos-usuario">0</span>
        <span class="stat-label">Puntos</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="nivel-usuario">1</span>
        <span class="stat-label">Nivel</span>
      </div>
      <a href="panel-profesor.html" id="btn-panel-admin" class="btn-salir" style="display:none;">Panel admin</a>
      <a href="panel-colegios.html" id="btn-panel-colegios" class="btn-salir" style="display:none;">Colegios</a>
      <a href="notas-estudiantes.html" id="btn-notas" class="btn-salir" style="display:none;">Mis estudiantes</a>
      <button id="btn-salir" class="btn-salir">Salir</button>
    </div>
  </header>

  <main class="dashboard-container">
    <h1>Explora los retos del club</h1>
    <a href="juegos/index.html" class="btn-juegos">🎮 Ir a los juegos interactivos</a>
    <p id="mensaje-carga">Cargando niveles...</p>
    <div id="progreso-eje-banner" style="display:none;"></div>
    <section id="insignias-seccion" style="display:none; margin-top:24px;">
      <h2>Mis insignias</h2>
      <div id="insignias-grid" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;"></div>
    </section>
    <div id="ejes-container"></div>
  </main>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { cerrarSesion } from "./js/auth.js";
    import {
      obtenerNiveles,
      agruparPorEje,
      NOMBRES_EJES,
      ORDEN_EJES,
      obtenerOAsignarProgreso,
      obtenerInstitucion,
    } from "./js/firestore.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const nombreEl = document.getElementById("nombre-usuario");
    const puntosEl = document.getElementById("puntos-usuario");
    const nivelEl = document.getElementById("nivel-usuario");
    const mensajeCarga = document.getElementById("mensaje-carga");
    const ejesContainer = document.getElementById("ejes-container");
    const bannerProgreso = document.getElementById("progreso-eje-banner");
    const btnSalir = document.getElementById("btn-salir");
    const btnPanelAdmin = document.getElementById("btn-panel-admin");

    btnSalir.addEventListener("click", async () => {
      await cerrarSesion();
      window.location.href = "index.html";
    });

    function crearTarjeta(nivel, completado) {
      const card = document.createElement("a");
      card.href = `nivel.html?id=${nivel.id}`;
      card.className = completado ? "nivel-card nivel-completado" : "nivel-card";
      card.innerHTML = `
        <span class="nivel-orden">Nivel ${nivel.orden}${completado ? " · Completado ✓" : ""}</span>
        <h3>${nivel.titulo}</h3>
        <p>${nivel.descripcion}</p>
        <span class="nivel-puntos">+${nivel.puntosOtorga} pts</span>
      `;
      return card;
    }

    // Vista para superadmin/profesor: explora todos los retos de todos los
    // ejes, agrupados. Es la vista que ya se venía usando para probar y
    // administrar contenido.
    function renderizarVistaCompleta(niveles, retosCompletados) {
      const grupos = agruparPorEje(niveles);
      Object.entries(grupos).forEach(([eje, nivelesDelEje]) => {
        const seccion = document.createElement("section");
        seccion.className = "eje-seccion";

        const titulo = document.createElement("h2");
        titulo.textContent = NOMBRES_EJES[eje] || eje;
        seccion.appendChild(titulo);

        const grid = document.createElement("div");
        grid.className = "niveles-grid";

        nivelesDelEje.forEach((nivel) => {
          const completado = retosCompletados.includes(nivel.id);
          grid.appendChild(crearTarjeta(nivel, completado));
        });

        seccion.appendChild(grid);
        ejesContainer.appendChild(seccion);
      });
    }

    // Vista para estudiantes: solo los 10 retos que le tocaron al azar en
    // el eje en el que va actualmente.
    function renderizarVistaEstudiante(niveles, retosCompletados, progreso) {
      const nivelesAsignados = progreso.retosAsignados
        .map((id) => niveles.find((n) => n.id === id))
        .filter(Boolean);

      const completadosEnEje = nivelesAsignados.filter((n) => retosCompletados.includes(n.id)).length;

      bannerProgreso.style.display = "block";
      bannerProgreso.innerHTML = `
        <p style="font-weight:600; margin-bottom:4px;">
          Eje actual: ${NOMBRES_EJES[progreso.ejeActual] || progreso.ejeActual}
        </p>
        <p>Retos completados en este eje: ${completadosEnEje} / ${nivelesAsignados.length}</p>
      `;

      const seccion = document.createElement("section");
      seccion.className = "eje-seccion";
      const grid = document.createElement("div");
      grid.className = "niveles-grid";

      nivelesAsignados.forEach((nivel) => {
        const completado = retosCompletados.includes(nivel.id);
        grid.appendChild(crearTarjeta(nivel, completado));
      });

      seccion.appendChild(grid);
      ejesContainer.appendChild(seccion);
    }

    let perfilActualGlobal = null;

    async function urlAImagenBase64(url) {
      try {
        const respuesta = await fetch(url);
        const blob = await respuesta.blob();
        return await new Promise((resolve, reject) => {
          const lector = new FileReader();
          lector.onload = () => resolve(lector.result);
          lector.onerror = reject;
          lector.readAsDataURL(blob);
        });
      } catch (error) {
        console.error("No se pudo cargar la imagen del certificado:", error);
        return null;
      }
    }

    async function generarCertificado(perfil, esFacilitador) {
      const { jsPDF } = window.jspdf;
      const docPdf = new jsPDF({ orientation: "landscape" });
      const w = docPdf.internal.pageSize.getWidth();
      const h = docPdf.internal.pageSize.getHeight();

      const institucion = perfil.institucionId ? await obtenerInstitucion(perfil.institucionId) : null;

      docPdf.setDrawColor(2, 136, 209);
      docPdf.setLineWidth(2);
      docPdf.rect(10, 10, w - 20, h - 20);

      if (institucion && institucion.escudoUrl) {
        const escudoB64 = await urlAImagenBase64(institucion.escudoUrl);
        if (escudoB64) {
          docPdf.addImage(escudoB64, "PNG", w / 2 - 12, 14, 24, 24);
        }
      }

      docPdf.setFontSize(12);
      docPdf.setTextColor(2, 136, 209);
      docPdf.text("CLUB DEFENSORES DEL AGUA", w / 2, 44, { align: "center" });
      if (institucion) {
        docPdf.setFontSize(10);
        docPdf.setTextColor(90, 90, 90);
        docPdf.text(institucion.nombre, w / 2, 50, { align: "center" });
      }

      docPdf.setFontSize(24);
      docPdf.setTextColor(20, 20, 20);
      docPdf.text(
        esFacilitador ? "Certificado de Facilitador" : "Certificado de Finalización",
        w / 2, 64, { align: "center" }
      );

      docPdf.setFontSize(12);
      docPdf.text("Se otorga el presente certificado a", w / 2, 78, { align: "center" });

      docPdf.setFontSize(20);
      docPdf.setTextColor(2, 136, 209);
      docPdf.text(perfil.nombre || (esFacilitador ? "Profesor" : "Estudiante"), w / 2, 90, { align: "center" });

      docPdf.setFontSize(11);
      docPdf.setTextColor(20, 20, 20);
      if (esFacilitador) {
        docPdf.text(
          "por completar el juego como facilitador del Club Defensores del Agua,",
          w / 2, 102, { align: "center" }
        );
        docPdf.text(
          "acompañando el proceso de aprendizaje de sus estudiantes.",
          w / 2, 109, { align: "center" }
        );
      } else {
        docPdf.text(
          "por completar exitosamente todos los retos del Club Defensores del Agua,",
          w / 2, 102, { align: "center" }
        );
        docPdf.text(
          `obteniendo un promedio final de ${perfil.promedioFinal ?? "—"}.`,
          w / 2, 109, { align: "center" }
        );
      }

      const fecha = new Date().toLocaleDateString("es-CO", { year: "numeric", month: "long", day: "numeric" });
      docPdf.setFontSize(9);
      docPdf.text(`Fecha: ${fecha}`, w / 2, 118, { align: "center" });

      // Firmas: profesor, rector, coordinador (imagen si la subieron, o solo
      // el nombre impreso si el directivo prefirió no compartir su firma)
      if (institucion) {
        const firmas = [
          { url: institucion.firmaProfesorUrl, nombre: institucion.nombreProfesor, etiqueta: "Profesor del curso" },
          { url: institucion.firmaRectorUrl, nombre: institucion.nombreRector, etiqueta: "Rector" },
          { url: institucion.firmaCoordinadorUrl, nombre: institucion.nombreCoordinador, etiqueta: "Coordinador" },
        ].filter((f) => f.url || f.nombre);

        if (firmas.length > 0) {
          const anchoDisponible = w - 40;
          const espacio = anchoDisponible / firmas.length;
          for (let i = 0; i < firmas.length; i++) {
            const x = 20 + espacio * i + espacio / 2;
            if (firmas[i].url) {
              const firmaB64 = await urlAImagenBase64(firmas[i].url);
              if (firmaB64) {
                docPdf.addImage(firmaB64, "PNG", x - 15, h - 42, 30, 14);
              }
            }
            docPdf.setDrawColor(120, 120, 120);
            docPdf.line(x - 20, h - 26, x + 20, h - 26);
            if (firmas[i].nombre) {
              docPdf.setFontSize(9);
              docPdf.setTextColor(30, 30, 30);
              docPdf.text(firmas[i].nombre, x, h - 21, { align: "center" });
              docPdf.setFontSize(7.5);
              docPdf.setTextColor(90, 90, 90);
              docPdf.text(firmas[i].etiqueta, x, h - 16, { align: "center" });
            } else {
              docPdf.setFontSize(8);
              docPdf.setTextColor(60, 60, 60);
              docPdf.text(firmas[i].etiqueta, x, h - 21, { align: "center" });
            }
          }
        }
      }

      const prefijoArchivo = esFacilitador ? "certificado-facilitador" : "certificado";
      docPdf.save(`${prefijoArchivo}-${(perfil.nombre || "usuario").replace(/\s+/g, "-")}.pdf`);
    }

    function renderizarInsignias(perfil) {
      const insigniasGanadas = perfil.insignias || [];
      const seccion = document.getElementById("insignias-seccion");
      const grid = document.getElementById("insignias-grid");
      seccion.style.display = "block";
      grid.innerHTML = "";

      // Una medalla por cada eje del juego, a color si ya se ganó
      ORDEN_EJES.forEach((eje) => {
        const idInsigniaEje = `eje-completado-${eje}`;
        const ganada = insigniasGanadas.includes(idInsigniaEje);
        const medalla = document.createElement("div");
        medalla.style.cssText = `
          width:90px; text-align:center; padding:10px 6px; border-radius:12px;
          background:${ganada ? "#e8f5ec" : "#f2f2f2"};
          border:1px solid ${ganada ? "#a8dab5" : "#ddd"};
          opacity:${ganada ? "1" : "0.55"};
        `;
        medalla.innerHTML = `
          <div style="font-size:1.8rem;">${ganada ? "🏅" : "🔒"}</div>
          <div style="font-size:.72rem; margin-top:4px; line-height:1.2;">${NOMBRES_EJES[eje] || eje}</div>
        `;
        grid.appendChild(medalla);
      });

      // Insignias individuales por reto (además de las de eje)
      const insigniasIndividuales = insigniasGanadas.filter(
        (id) => !id.startsWith("eje-completado-")
      );
      if (insigniasIndividuales.length > 0) {
        const nota = document.createElement("div");
        nota.style.cssText = "width:100%; margin-top:10px; font-size:.85rem; color:#555;";
        nota.textContent = `+ ${insigniasIndividuales.length} insignia(s) especial(es) ganada(s) en retos individuales.`;
        grid.appendChild(nota);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const perfilSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!perfilSnap.exists()) {
        window.location.href = "index.html";
        return;
      }
      const perfil = perfilSnap.data();

      nombreEl.textContent = perfil.nombre;
      puntosEl.textContent = perfil.puntos;
      nivelEl.textContent = perfil.nivelActual;

      if (perfil.rol === "superadmin") {
        btnPanelAdmin.style.display = "inline-block";
        document.getElementById("btn-panel-colegios").style.display = "inline-block";
      }
      if (perfil.rol === "profesor" || perfil.rol === "superadmin") {
        document.getElementById("btn-notas").style.display = "inline-block";
      }

      const retosCompletados = perfil.retosCompletados || [];

      try {
        const niveles = await obtenerNiveles();
        mensajeCarga.remove();

        const puedeJugar = perfil.rol === "estudiante" || perfil.rol === "profesor";

        if (puedeJugar) {
          renderizarInsignias(perfil);
          const esFacilitador = perfil.rol === "profesor";
          if (perfil.juegoCompletado) {
            bannerProgreso.style.display = "block";
            bannerProgreso.innerHTML = `
              <p style="font-weight:600;">¡Completaste todos los ejes del juego! 🎉</p>
              <p>Promedio final: ${perfil.promedioFinal ?? "—"}</p>
              <button id="btn-certificado" type="button">🏆 Descargar mi certificado${esFacilitador ? " de facilitador" : ""}</button>
            `;
            document.getElementById("btn-certificado").addEventListener("click", async (e) => {
              e.target.disabled = true;
              e.target.textContent = "Generando...";
              await generarCertificado(perfil, esFacilitador);
              e.target.disabled = false;
              e.target.textContent = `🏆 Descargar mi certificado${esFacilitador ? " de facilitador" : ""}`;
            });
          } else {
            const progreso = await obtenerOAsignarProgreso(user.uid, perfil);
            renderizarVistaEstudiante(niveles, retosCompletados, progreso);
          }
        } else {
          renderizarVistaCompleta(niveles, retosCompletados);
        }
      } catch (error) {
        mensajeCarga.textContent = "No se pudieron cargar los niveles.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
